name: Release Packages

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

# SUP-001: least-privilege token permissions (contents/PRs for the release PR,
# id-token for npm provenance attestations).
permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Build, Test & Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # @changesets/cli 3.x requires Node ^22.11 || ^24 (module.enableCompileCache)
          # and npm >= 10.9.0, so the release toolchain cannot run on Node 20.
          node-version: 24
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Workspace Packages
        run: pnpm build

      - name: Lint (type-check)
        run: pnpm lint

      - name: Run Unit Tests
        run: pnpm test

      # SUP-001: publishing is driven by changesets — a "Version Packages" PR is
      # opened when changesets are pending, and packages are published only from
      # CI after that PR merges (no publish on arbitrary pushes).
      - name: Create Release PR or Publish to npm
        uses: changesets/action@v1
        with:
          publish: pnpm -r publish --access public --no-git-checks
          title: 'chore(release): version packages'
          commit: 'chore(release): version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
